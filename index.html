<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172033">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>B-IV LernApp</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--text:#172033;--muted:#667085;--accent:#155eef;--border:#d9dee7;--good:#15803d;--bad:#b91c1c;--dark:#172033}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}button,input,select{font:inherit}header{background:var(--dark);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:#cbd5e1;font-size:13px}
main{max-width:900px;margin:auto;padding:14px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap;padding:11px 14px;border:1px solid var(--border);border-radius:12px;background:#fff;font-weight:700}.tabs button.active{background:var(--dark);color:#fff}
.panel.hidden{display:none}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.toolbar>*{width:100%;padding:11px;border:1px solid var(--border);border-radius:11px;background:#fff}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 4px 20px #0000000b}.meta{font-size:12px;color:var(--muted);margin-bottom:10px}.q{font-size:21px;font-weight:750;line-height:1.48;white-space:pre-wrap}.answer{margin-top:18px;border-top:1px solid #e5e7eb;padding-top:18px;font-size:16px;line-height:1.6;white-space:pre-wrap}.hidden{display:none!important}
.actions,.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.actions button,.nav button{flex:1;min-width:120px;padding:12px;border:1px solid var(--border);border-radius:11px;background:#fff;font-weight:700}.primary{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.stat{background:#fff;border:1px solid var(--border);border-radius:11px;padding:9px 11px;font-size:13px}.progress{height:7px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin:10px 0 14px}.progress i{display:block;height:100%;width:0;background:var(--accent)}
.search{width:100%;padding:12px;border:1px solid var(--border);border-radius:11px;background:#fff}.list{margin-top:10px}.item{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;margin:7px 0;cursor:pointer}.item b{display:block;margin-bottom:4px}.small{font-size:12px;color:var(--muted)}
.option{display:block;width:100%;margin:8px 0;padding:12px;text-align:left;border:1px solid var(--border);border-radius:11px;background:#fff}.correct{border-color:var(--good);background:#ecfdf3}.wrong{border-color:var(--bad);background:#fff1f2}
.note{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:10px;font-size:12px;margin-bottom:12px}
@media(max-width:650px){.toolbar{grid-template-columns:1fr}.q{font-size:19px}}
</style>
</head>
<body>
<header><h1>🚒 B-IV LernApp</h1><p>82 Fragen aus deinen B-IV-Unterlagen</p></header>
<main>
<div class="note">Die Fragen und Antworten stammen aus der OCR-Excel-Datei. OCR-Fehler können enthalten sein.</div>
<div class="tabs"><button id="tLearn" class="active">📚 Lernen</button><button id="tQuiz">🎯 Prüfung</button><button id="tList">🔎 Fragen</button></div>

<section id="learn">
<div class="toolbar"><select id="doc"></select><select id="mode"><option value="all">Alle Fragen</option><option value="unseen">Noch nicht gelernt</option><option value="hard">Schwierig</option></select></div>
<div class="stats"><div class="stat">Fragen <b id="cnt"></b></div><div class="stat">Gelernt <b id="done"></b></div><div class="stat">Schwierig <b id="hard"></b></div></div>
<div class="progress"><i id="prog"></i></div>
<div class="card"><div class="meta" id="meta"></div><div class="q" id="q"></div><div class="answer hidden" id="a"></div>
<div class="actions"><button class="primary" id="show">Antwort anzeigen</button><button id="yes">✓ Gewusst</button><button id="no">✗ Nicht gewusst</button><button id="star">⭐ Schwierig</button></div></div>
<div class="nav"><button id="prev">← Zurück</button><button id="next">Weiter →</button></div>
</section>

<section id="quiz" class="hidden">
<div class="toolbar"><select id="quizDoc"></select><select id="quizSize"><option value="10">10 Fragen</option><option value="20">20 Fragen</option><option value="40">40 Fragen</option><option value="82">Alle Fragen</option></select></div>
<div class="card"><div class="meta" id="qm"></div><div class="q" id="qq"></div><div id="opts"></div><div class="small" id="fb"></div>
<div class="actions"><button class="primary" id="newQuiz">Neue Prüfung</button><button id="nextQuiz">Nächste →</button></div></div>
</section>

<section id="list" class="hidden">
<div class="toolbar"><input id="search" class="search" placeholder="Frage durchsuchen …"><select id="listDoc"></select></div>
<div id="listBox" class="list"></div>
</section>
</main>
<script src="data.js"></script>
<script>
(function(){
const C=window.BIV_CARDS||[], KEY="biv-pwa-v1";
let S={learned:{},hard:{}};try{S=JSON.parse(localStorage.getItem(KEY)||"{}");S.learned=S.learned||{};S.hard=S.hard||{}}catch(e){}
let pool=[],i=0,quiz=[],qi=0,score=0,answered=false;
const $=id=>document.getElementById(id);
const docs=[...new Set(C.map(x=>x.document))];
function fill(el){el.innerHTML='<option value="ALL">Alle Dokumente</option>'+docs.map(d=>'<option>'+esc(d)+'</option>').join('')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
fill($("doc"));fill($("quizDoc"));fill($("listDoc"));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function filter(){let d=$("doc").value,m=$("mode").value;return C.filter(x=>(d==="ALL"||x.document===d)&&(m==="all"||(m==="unseen"&&!S.learned[x.id])||(m==="hard"&&S.hard[x.id])))}
function render(){ $("cnt").textContent=pool.length;$("done").textContent=Object.values(S.learned).filter(Boolean).length;$("hard").textContent=Object.values(S.hard).filter(Boolean).length;$("prog").style.width=Math.round(Object.values(S.learned).filter(Boolean).length/C.length*100)+"%";if(!pool.length){$("q").textContent="Keine Fragen in dieser Auswahl.";return}let x=pool[i];$("meta").textContent=(i+1)+" / "+pool.length+" · "+x.document+" · Frage "+x.number+" · Seite "+x.page_from;$("q").textContent=x.question;$("a").textContent=x.answer||"Keine Antwort als Text extrahiert.";$("a").classList.add("hidden");$("show").textContent="Antwort anzeigen"}
function reset(){pool=filter();i=0;render()}
$("doc").onchange=reset;$("mode").onchange=reset;
$("show").onclick=()=>{$("a").classList.toggle("hidden");$("show").textContent=$("a").classList.contains("hidden")?"Antwort anzeigen":"Antwort verbergen"};
$("next").onclick=()=>{if(pool.length){i=(i+1)%pool.length;render()}};$("prev").onclick=()=>{if(pool.length){i=(i-1+pool.length)%pool.length;render()}};
$("yes").onclick=()=>{if(!pool.length)return;S.learned[pool[i].id]=true;S.hard[pool[i].id]=false;save();i=(i+1)%pool.length;render()};
$("no").onclick=()=>{if(!pool.length)return;S.learned[pool[i].id]=false;S.hard[pool[i].id]=true;save();i=(i+1)%pool.length;render()};
$("star").onclick=()=>{if(!pool.length)return;S.hard[pool[i].id]=!S.hard[pool[i].id];save();render()};

function tabs(t){["learn","quiz","list"].forEach(x=>$(x).classList.toggle("hidden",x!==t));["tLearn","tQuiz","tList"].forEach(x=>$(x).classList.remove("active"));$("t"+t[0].toUpperCase()+t.slice(1)).classList.add("active");if(t==="list")list();if(t==="quiz"&&!quiz.length)startQuiz()}
$("tLearn").onclick=()=>tabs("learn");$("tQuiz").onclick=()=>tabs("quiz");$("tList").onclick=()=>tabs("list");

function list(){let s=$("search").value.toLowerCase(),d=$("listDoc").value;let arr=C.filter(x=>(d==="ALL"||x.document===d)&&(x.question+" "+x.answer).toLowerCase().includes(s));$("listBox").innerHTML=arr.map(x=>'<div class="item" data-id="'+x.id+'"><b>'+esc(x.question)+'</b><span class="small">'+esc(x.document)+' · Frage '+esc(x.number)+'</span></div>').join("");[...$("listBox").children].forEach(e=>e.onclick=()=>{let id=+e.dataset.id;$("doc").value="ALL";$("mode").value="all";reset();i=pool.findIndex(x=>x.id===id);render();tabs("learn");window.scrollTo(0,0)})}
$("search").oninput=list;$("listDoc").onchange=list;

function startQuiz(){let d=$("quizDoc").value,arr=C.filter(x=>d==="ALL"||x.document===d).sort(()=>Math.random()-.5);quiz=arr.slice(0,Math.min(+$("quizSize").value,arr.length));qi=0;score=0;renderQuiz()}
function renderQuiz(){if(qi>=quiz.length){$("qm").textContent="Prüfung beendet";$("qq").textContent="Ergebnis: "+score+" / "+quiz.length;$("opts").innerHTML="";$("fb").textContent="";return}let x=quiz[qi];answered=false;$("qm").textContent="Frage "+(qi+1)+" / "+quiz.length+" · "+x.document;$("qq").textContent=x.question;$("fb").textContent="";let os=[x,...C.filter(y=>y.id!==x.id).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);$("opts").innerHTML=os.map(o=>'<button class="option" data-id="'+o.id+'">'+esc((o.answer||"Keine Antwort").slice(0,260))+(o.answer&&o.answer.length>260?"…":"")+'</button>').join("");[...$("opts").children].forEach(b=>b.onclick=()=>answer(+b.dataset.id,b))}
function answer(id,b){if(answered)return;answered=true;if(id===quiz[qi].id){score++;b.classList.add("correct");$("fb").textContent="✓ Richtig"}else{b.classList.add("wrong");$("fb").textContent="✗ Falsch"}}
$("newQuiz").onclick=startQuiz;$("nextQuiz").onclick=()=>{if(!quiz.length)startQuiz();else{qi++;renderQuiz()}};
reset();list();
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
</body></html>
